name: Build and Deploy to EKS
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::589578576300:role/GitHubActionsRole
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/project-app:$IMAGE_TAG .
          docker push $ECR_REGISTRY/project-app:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/project-app:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name curious-indie-sparrow --region us-east-2

      - name: Deploy to EKS
        run: |
          # This replaces the image tag in your yaml with the new one we just built
          sed -i "s|image:.*|image: 589578576300.dkr.ecr.us-east-2.amazonaws.com/project-app:${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml